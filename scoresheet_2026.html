<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スコアシート</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef0f3;--card:#fff;--ink:#14171c;--mute:#667085;--line:#dfe3e8;--acc:#1c4fd8;--ok:#117a45;--okbg:#ddf3e7;--ng:#b8312f;--ngbg:#fae4e3;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1216;--card:#181c22;--ink:#eef1f5;--mute:#98a2b3;--line:#2a303a;--acc:#7da2ff;--ok:#56d193;--okbg:#14301f;--ng:#ff8b88;--ngbg:#3a1a1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1216;--card:#181c22;--ink:#eef1f5;--mute:#98a2b3;--line:#2a303a;--acc:#7da2ff;--ok:#56d193;--okbg:#14301f;--ng:#ff8b88;--ngbg:#3a1a1a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:13px;letter-spacing:.12em;margin:4px 2px 10px;color:var(--mute);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.meta label{display:flex;flex-direction:column;font-size:11px;color:var(--mute);gap:2px}
.meta label.w{grid-column:1/3}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tot{display:grid;grid-template-columns:1fr 1fr 1.4fr;margin:10px 0;overflow:hidden}
.tot div{padding:8px 12px;border-right:1px solid var(--line);font-size:11px;color:var(--mute)}
.tot div:last-child{border:0;background:var(--ink);color:var(--bg)}
.tot b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.tot div:last-child b{color:var(--bg);font-size:34px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 6px;font-size:14px}
.sec span{color:var(--mute);font-size:12px}.sec em{font-style:normal;font-weight:700;font-size:18px;color:var(--ink);margin-left:4px}
.row{display:grid;grid-template-columns:26px 1fr 64px 34px;align-items:center;gap:6px;padding:6px 8px 6px 10px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s,box-shadow .12s}
.row.drag{transform:scale(1.03);border-color:var(--acc);box-shadow:0 8px 24px rgba(0,0,0,.25);position:relative;z-index:2}
.idx{color:var(--mute);font-size:13px;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.sk{display:flex;align-items:center;gap:8px;min-height:48px;background:none;border:0;text-align:left;padding:0;min-width:0}
.sk .nm{font-weight:600;min-width:0;overflow-wrap:anywhere;line-height:1.35;padding:2px 0}
.sk small{color:var(--mute);font-size:11px;margin-left:auto;flex:none}
.ph{color:var(--acc);font-weight:600}
.lv{font-style:normal;flex:none;color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:5px;background:hsl(calc(var(--l)*47 + 205) 55% 40%)}
.res{height:48px;border-radius:8px;border:1.5px dashed var(--line);background:none;font-size:22px;font-weight:700;color:var(--mute)}
.res.ok{background:var(--okbg);border:1.5px solid var(--ok);color:var(--ok)}
.res.ng{background:var(--ngbg);border:1.5px solid var(--ng);color:var(--ng)}
.res:disabled{opacity:.35}
.pt{text-align:right;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--mute);margin:10px 4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center}
.btn{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.ov[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:82%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 8px;font-size:15px}
.lvs{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.chip{flex:none;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:none;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pl{overflow-y:auto;flex:1}
.pi{display:flex;align-items:center;gap:8px;width:100%;padding:11px 6px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.pi:disabled{opacity:.4}.pi .u{margin-left:auto;font-size:11px;color:var(--mute)}
.pi.cur{background:var(--bg)}
textarea{height:150px;font:12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;margin:8px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.msg{font-size:12px;color:var(--mute);min-height:18px;margin-top:6px}
.tall{height:82vh;height:82dvh}
.ov,.pl,.lvs,textarea{overscroll-behavior:contain}
.lvs{touch-action:pan-x}
body.lock{overflow:hidden}
.row.drag{transition:none}
.row.over{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hd h1{margin:4px 2px}
.btn.sm{padding:5px 10px;font-size:12px}
.ed{margin:0 10px 0 auto;font-size:12px;color:var(--mute)}
.pi span:not(.u){min-width:0;overflow-wrap:anywhere;line-height:1.35}
.pi .u{flex:none}
.btn.big{flex:1 1 auto;max-width:280px;font-size:16px;padding:12px 18px}
@media (min-width:900px){.wrap{max-width:1080px}#list{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>SCORE SHEET</h1><span class="ed" id="ed"></span><button class="btn sm" id="bTheme"></button></div>
  <div class="card meta">
    <label class="w">Name<input id="pnm" autocomplete="off"></label>
  </div>
  <div class="card tot">
    <div>前半 Round 1<b id="t1">0</b></div>
    <div>後半 Round 2<b id="t2">0</b></div>
    <div>TOTAL SCORE<b id="tt">0</b></div>
  </div>
  <div id="list"></div>
  <p class="hint">技名をタップで選択・変更／右の枠をタップで ○⇄✕ ／行を長押ししてドラッグで並べ替え（PCはクリック長めで並び替え）</p>
</div>

<div class="bar">
  <button class="btn p big" id="bPng">画像として保存</button>
  <button class="btn" id="bJson">JSON 保存・読込</button>
  <button class="btn" id="bReset">リセット</button>
</div>

<div class="ov" id="pick" hidden><div class="sheet tall">
  <h2 id="pickT">技を選択</h2>
  <input id="q" placeholder="技名・No. で検索" autocomplete="off">
  <div class="lvs" id="lvs"></div>
  <div class="pl" id="pl"></div>
  <div class="acts" style="margin-top:8px"><button class="btn" id="pClear">この枠を空にする</button><button class="btn" id="pClose">閉じる</button></div>
</div></div>

<div class="ov" id="jd" hidden><div class="sheet">
  <h2>構成の保存・読込（JSON）</h2>
  <input id="fname" placeholder="構成名（ファイル名）" autocomplete="off" style="margin:2px 0 18px">
  
  <div class="acts">
    <button class="btn p" id="jDl">ファイルに保存</button>
    <label class="btn" style="cursor:pointer">ファイルを選択<input type="file" id="jf" accept=".json,application/json" hidden></label>
    <button class="btn" id="jX">閉じる</button>
  </div>
  <div class="msg" id="jm"></div>
</div></div>

<div class="ov" id="png" hidden><div class="sheet tall">
  <h2>画像として保存</h2>
  <div class="pl"><img id="pngImg" alt="スコアシート" style="width:100%;display:block;border:1px solid var(--line)"></div>
  <div class="acts" style="margin-top:8px"><button class="btn p" id="pngDl">画像を保存</button><button class="btn" id="pngX">閉じる</button></div>
  <div class="msg" id="pngM"></div>
</div></div>

<script>
/* ================= 配布時に編集する設定 =================
   EDITION: 画面右上とPNG出力に表示される版名。ここだけ書き換えてください。
   例: const EDITION = "2027年度版";
   ====================================================== */
const EDITION = "2026";

/* 技リスト: [レベル, No., 技名]。配布版ではビルドスクリプトが SKILLS_START〜SKILLS_END の間をCSVから生成したJSONに置換する（デモ用ダミー） */
const SKILLS = /*SKILLS_START*/[
[1,1,"波（大皿）"],[1,2,"どじょうすくい"],[1,3,"けん玉つみき灯台"],[1,4,"中皿おとし玉"],[1,5,"フラフープ（大皿）"],[1,6,"つるし～両手キャッチ"],[1,7,"手のせ大皿ウォーク5歩"],[1,8,"手のせ大皿スクワット"],[1,9,"手のせ大皿"],[1,10,"手のせ大皿ホップ"],
[2,1,"ろうそく"],[2,2,"大皿"],[2,3,"小皿～大皿～中皿"],[2,4,"手のせ大皿～けんけんぱ"],[2,5,"野球"],[2,6,"たこやき"],[2,7,"手のせ大皿～けん"],[2,8,"もしかめ11回"],[2,9,"手拍子つるし持ち"],[2,10,"とめけん（まわしけん可）"],
[3,1,"ず～まスロー大皿"],[3,2,"飛行機"],[3,3,"日本一周"],[3,4,"世界一周"],[3,5,"もしかめ10回以上～けん"],[3,6,"灯台～さかおとし"],[3,7,"すくいけん"],[3,8,"ふりけん"],[3,9,"とめけん（まわしけん可）～たけとんぼ"],[3,10,"ダウンスパイク"],
[4,1,"とめけん～たけとんぼバンジーけんフリップけん"],[4,2,"はねけん"],[4,3,"ヨーロッパ一周"],[4,4,"すくいけんファストハンド"],[4,5,"中皿さかおとし"],[4,6,"1回転灯台～けん"],[4,7,"うぐいす～回転けん"],[4,8,"月面着陸～1回転さかおとし"],[4,9,"フラミンゴ足たこやき"],[4,10,"レジェンド"],
[5,1,"うずしおふりけん"],[5,2,"はねけん～うらはねけん"],[5,3,"USA一周"],[5,4,"ワールウィンド"],[5,5,"ジャグル大皿～けん"],[5,6,"たけうま～1回転さかおとし"],[5,7,"中皿極意～回転けん"],[5,8,"うら月面～月面～灯台～さかおとし"],[5,9,"タップ1回転イン"],[5,10,"宇宙遊泳"],
[6,1,"ジャグルとめけん"],[6,2,"飛行機～1.5回転スワップけん"],[6,3,"うら1回転灯台～うら灯台とんぼ返り～うら1回転さかおとし"],[6,4,"ダブルワールウィンド"],[6,5,"2回転風車けん"],[6,6,"たけうまとんぼ返り～1回転さかおとし"],[6,7,"2回転飛行機～2回転はねけん"],[6,8,"うら月面～1回転クッションタップうら月面～さかおとし"],[6,9,"足けん"],[6,10,"稲妻おとしスワップけん"],
[7,1,"タップジャグルけん"],[7,2,"飛行機～1.5回転スワップジャグルけん"],[7,3,"ふち一周～回転けん"],[7,4,"うぐいす～けんフリップうぐいす～回転けん"],[7,5,"1回転灯台～タップ灯台往復～けん"],[7,6,"アンダーバード～遠心力アンダーバード～ろうそくアンダーバード～さかおとし"],[7,7,"ウィング渡り～回転けん"],[7,8,"ダウンスパイク ファストハンド一周"],[7,9,"もしかめ100回以上～けん"],[7,10,"1回転灯台～スワップトス灯台～すくいけんファストハンド"],
[8,1,"2タップジャグルけん"],[8,2,"飛行機～1.5回転スワップジャグルうぐいす～回転けん"],[8,3,"灯台とんぼ返り1-2-3～けん"],[8,4,"マテオチャンス"],[8,5,"ジャグル～2ジャグルけん～3ジャグルけん"],[8,6,"3回転風車うぐいす～回転けん"],[8,7,"たけうま渡り～まさかり渡り～けん"],[8,8,"中皿極意～中皿極意 地球まわし～うら中皿極意地球まわし～回転けん"],[8,9,"1回転アームバウンス トスアームバウンス 1回転さかおとし"],[8,10,"けんフリップスワップ すくいけんファストハンド"],
[9,1,"ジャグル10回以上 →けん"],[9,2,"飛行機～ビッグタップ×2→スワップジャグルけん"],[9,3,"ワールウィンド1-2-3"],[9,4,"3回転けんフリップ→うら3回転けん フリップジャグルけん"],[9,5,"飛行機～1.5スワップ風車1.5回転トスイン"],[9,6,"たけうま渡り～うぐいすの谷渡り～回転けん"],[9,7,"ウィング渡り～中皿極意～回転けん"],[9,8,"飛行機～3.5回転フリップ スワップ3.5回転 けんフリップジャグル ダウンスパイク"],[9,9,"フロアけん先タップおこし 中皿～ダウンスパイク"],[9,10,"胡蝶の舞けんフリップ フリップふりけん"],
[10,1,"飛行機～クッションタップ スワップゴースト トス タップフリップスワップ トスクッション タップイン"],[10,2,"3回転けんフリップ→3回転けんフリップ ジャグル3.5回転トスイン"],[10,3,"スパイク～ヒッピー3回転 フリップスワップけん"],[10,4,"飛行機～4タップスワップ1.5回転トスイン"],[10,5,"けんフリップトスクラウド バウンスジャグル けんフリップけん"],[10,6,"3タップ3回転けん フリップジャグルけん"],[10,7,"たけうまころがし～1回転さかおとし"],[10,8,"前ふりバックワードうら月面～1.5回転バックフリップ月面～1.5回転バックフリップうら月面～1回転スワップけん"],[10,9,"フラミンゴふりけん～フラミンゴワールウィンド（持ち手側の足の下）"],[10,10,"風車トス灯台～うら灯台 とんぼ返りインスタ3回転 フリップスワップ風車けん"],
[11,1,"けんフリップ→2回転けんフリップジャグル 3回転けんフリップけん"],[11,2,"うぐいす～うらトスタップ スワップけんフリップ うぐいす～回転けん"],[11,3,"クッションタップスワップ 2回転トスクッションタップ スワップ3回転トスクッション タップスワップけん"],[11,4,"けんフリップうらけん フリップトスタップスワップ うらトスタップスワップけん"],[11,5,"たけうまとんぼ返り1-2-3～1回転さかおとし"],[11,6,"ビッグタップ×2→ ジャグル中皿極意～ ダウンスパイクファストハンド"],[11,7,"4タップジャグル けんフリップうぐいす～回転けん"],[11,8,"プルアップタップうら2回転 スワップゴーストトスタップ うら2回転うら月面～ タップうら2回転スワップけん"],[11,9,"中皿極意～たけうま渡り～中皿極意～ダウンスパイク"],[11,10,"すくいけん～3回転 フリップすくいけん ペンギンファストハンド"],
[12,1,"稲妻はやて1回転 すくいけんファストハンド"],[12,2,"6タップスワップトス灯台 インスタ3回転フリップ スワップ3回転けん フリップジャグルけん"],[12,3,"月面バレルロール1-2-3～さかおとし"],[12,4,"飛行機1.5回転スワップ けんフリップフリップ フリップ1.5回転トスイン"],[12,5,"飛行機～3タップスワップ うら2.5回転トスタップ スワップうら3.5回転トスイン"],[12,6,"灯台とんぼ返りインスタ うらとんぼ返り1-2-3～けん"],[12,7,"うらたけうま～4回転 うらたけうまとんぼ返り～1回転さかおとし"],[12,8,"飛行機～4タップスワップ うら風車ダウンスパイク ファストハンド"],[12,9,"ピルエットつるしとめけん"],[12,10,"タンブリッジウェルズ一周"],
[13,1,"けんフリップジャグルけん フリップフリップジャグルけん フリップフリップフリップけん"],[13,2,"ビッグタップ×4 →ジャグルゴースト すくいけんファストハンド"],[13,3,"2タップ灯台～ 4タップ灯台～ 6タップ灯台～けん"],[13,4,"うぐいす～トス2タップスワップ 1.5回転けんフリップジャグル 2回転うら風車1.5回転 けんフリップジャグルトス2タップ スワップうぐいす～ダウンスパイク"],[13,5,"1回転月面～ 6タップ1回転月面～ 1回転さかおとし"],[13,6,"タップ1.5回転スワップ 中皿極意～トスタップ1.5回スワップ中皿極意 ～ダウンスパイク"],[13,7,"ウィング～ジャグル3回転 けんフリップジャグル ウィング～回転けん"],[13,8,"前ふりバックワードうら月面～ タップ1.5回転→タップスワップ けんフリップトスタップ1.5回転 →タップバックワードうら月面 ～1回転クッションタップイン"],[13,9,"スパイク～ワールウィンド アラウンドバックけん グリップキャッチスパイク"],[13,10,"3回転けんフリップ3回転 けんフリップ3回転トス すくいけんファストハンド"]
]/*SKILLS_END*/.map(([level,no,name])=>({level:+level,no:+no,name,key:level+'-'+no}));
const BY={};SKILLS.forEach(k=>BY[k.key]=k);

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let slots=Array(10).fill(null), drag=null, suppress=false;

const pts=s=>s&&s.result==='ok'&&BY[s.id]?BY[s.id].level:0;
const sub=r=>slots.slice(r*5,r*5+5).reduce((a,s)=>a+pts(s),0);

function render(){
  let h='';
  for(let i=0;i<10;i++){
    if(i%5===0){const r=i/5;h+=`${r?'</div>':''}<div class="col"><div class="sec"><b>${r?'後半 Round 2':'前半 Round 1'}</b><span>小計<em>${sub(r)}</em></span></div>`}
    const s=slots[i],k=s&&BY[s.id];
    h+=`<div class="row${drag&&drag.i===i?' drag':''}" data-i="${i}"><span class="idx">${i+1}</span>`+
    `<button class="sk" data-act="pick">${k?`<i class="lv" style="--l:${k.level}">Lv${k.level}-${k.no}</i><span class="nm">${esc(k.name)}</span>`:'<span class="ph">＋ 技を選択</span>'}</button>`+
    `<button class="res ${s&&s.result||''}" data-act="res" ${k?'':'disabled'} aria-label="成否">${s&&s.result==='ok'?'○':s&&s.result==='ng'?'✕':'－'}</button>`+
    `<span class="pt">${pts(s)}</span></div>`;
  }
  $('list').innerHTML=h+'</div>';
  const a=sub(0),b=sub(1);$('t1').textContent=a;$('t2').textContent=b;$('tt').textContent=a+b;
}

/* タップ */
$('list').addEventListener('click',e=>{
  if(suppress){suppress=false;return}
  const row=e.target.closest('.row'),btn=e.target.closest('[data-act]');
  if(!row||!btn)return;
  const i=+row.dataset.i;
  if(btn.dataset.act==='res'&&slots[i]){const r=slots[i].result;slots[i].result=r==='ok'?'ng':r==='ng'?null:'ok';render()}
  else if(btn.dataset.act==='pick')openPick(i);
});

/* 長押しで並べ替え: ドラッグ中はDOMを作り直さず、行を指に追従させ、離した位置で確定する */
let timer=null,sx=0,sy=0,el0=null,dy=0,lastY=0,scr=0,auto=null;
const list=$('list');
list.addEventListener('contextmenu',e=>e.preventDefault());
const rowEls=()=>[...list.querySelectorAll('.row')];
let pos=[],hs=[],rw=0,lastX=0;
const orderFor=(i,t)=>{const o=[...Array(10).keys()];o.splice(i,1);o.splice(t,0,i);return o};
function layoutOf(order){
  const gap=pos[1].y-pos[0].y-hs[0],res=[];
  for(let c=0;c<2;c++){let y=pos[c*5].y;for(let s=c*5;s<c*5+5;s++){const r=order[s];res[r]={x:pos[c*5].x,y};y+=hs[r]+gap}}
  return res;
}
function dragMove(){
  if(!drag)return;
  dy=lastY-sy+(window.scrollY-scr);const dx=lastX-sx;
  el0.style.transform=`translate(${dx}px,${dy}px) scale(1.04)`;
  let best=drag.i,bd=1e12;
  const ci=pos[drag.i].x+rw/2+dx,cj=pos[drag.i].y+hs[drag.i]/2+dy;
  for(let t=0;t<10;t++){const p=layoutOf(orderFor(drag.i,t))[drag.i];const d=(ci-p.x-rw/2)**2+(cj-p.y-hs[drag.i]/2)**2;if(d<bd){bd=d;best=t}}
  if(best!==drag.t){
    drag.t=best;
    const L=layoutOf(orderFor(drag.i,best));
    rowEls().forEach((r,k)=>{if(k!==drag.i)r.style.transform=`translate(${L[k].x-pos[k].x}px,${L[k].y-pos[k].y}px)`});
  }
}
list.addEventListener('pointerdown',e=>{
  const row=e.target.closest('.row');if(!row)return;
  const i=+row.dataset.i;if(!slots[i])return;
  sx=lastX=e.clientX;sy=lastY=e.clientY;
  clearTimeout(timer);
  timer=setTimeout(()=>{
    timer=null;drag={i,t:i};suppress=true;el0=row;scr=window.scrollY;dy=0;
    {const b=row.getBoundingClientRect();rw=b.width}
    hs=rowEls().map(r=>r.getBoundingClientRect().height);
    pos=rowEls().map(r=>{const b=r.getBoundingClientRect();return{x:b.left+window.scrollX,y:b.top+window.scrollY}});
    row.classList.add('drag');
    try{row.setPointerCapture(e.pointerId)}catch(_){}
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    auto=setInterval(()=>{if(lastY<90)window.scrollBy(0,-10);else if(lastY>innerHeight-110)window.scrollBy(0,10);dragMove()},16);
  },450);
});
window.addEventListener('pointermove',e=>{
  lastX=e.clientX;lastY=e.clientY;
  if(!drag){if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>10){clearTimeout(timer);timer=null}return}
  dragMove();
});
function endDrag(commit){
  clearTimeout(timer);timer=null;clearInterval(auto);
  if(!drag)return;
  const {i,t}=drag;drag=null;
  const fin=()=>{if(commit&&t!==i){const [s]=slots.splice(i,1);slots.splice(t,0,s)}render();setTimeout(()=>suppress=false,60)};
  if(commit){el0.style.transition='transform .15s';el0.style.transform=(()=>{const L=layoutOf(orderFor(i,t))[i];return `translate(${L.x-pos[i].x}px,${L.y-pos[i].y}px)`})();setTimeout(fin,160)}
  else fin();
}
window.addEventListener('pointerup',()=>endDrag(true));
window.addEventListener('pointercancel',()=>endDrag(false));
list.addEventListener('touchmove',e=>{if(drag)e.preventDefault()},{passive:false});

/* 技の選択（使用済みは選べない） */
let pickI=null,lvF=0;
function openPick(i){pickI=i;lvF=0;$('q').value='';$('pickT').textContent=`${i+1}番目の技を選択`;$('pick').hidden=false;drawPick()}
function drawPick(){
  const used=new Set(slots.map((s,j)=>s&&j!==pickI?s.id:null));
  const lvls=[...new Set(SKILLS.map(k=>k.level))].sort((a,b)=>a-b);
  $('lvs').innerHTML=[0,...lvls].map(l=>`<button class="chip${l===lvF?' on':''}" data-l="${l}">${l?'Lv'+l:'すべて'}</button>`).join('');
  const q=$('q').value.trim().toLowerCase(),cur=slots[pickI]&&slots[pickI].id;
  $('pl').innerHTML=SKILLS.filter(k=>(!lvF||k.level===lvF)&&(!q||k.name.toLowerCase().includes(q)||String(k.no).includes(q)))
   .map(k=>`<button class="pi${k.key===cur?' cur':''}" data-k="${k.key}" ${used.has(k.key)?'disabled':''}><i class="lv" style="--l:${k.level}">Lv${k.level}-${k.no}</i><span>${esc(k.name)}</span><span class="u">${used.has(k.key)?'使用済み':''}</span></button>`).join('')||'<p class="hint">該当する技がありません</p>';
}
$('lvs').addEventListener('click',e=>{const c=e.target.closest('[data-l]');if(c){lvF=+c.dataset.l;drawPick()}});
$('q').addEventListener('input',drawPick);
$('pl').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b||b.disabled)return;
  slots[pickI]={id:b.dataset.k,result:slots[pickI]?slots[pickI].result:null};
  $('pick').hidden=true;render();
});
$('pClear').onclick=()=>{slots[pickI]=null;$('pick').hidden=true;render()};
$('pClose').onclick=()=>$('pick').hidden=true;
$('pick').addEventListener('click',e=>{if(e.target===$('pick'))$('pick').hidden=true});

/* JSON 保存・読込 */
function toJSON(){
  return JSON.stringify({version:1,name:$('fname').value.trim()||'無題',savedAt:new Date().toISOString(),
    player:{name:$('pnm').value},
    slots:slots.map(s=>s?{level:BY[s.id].level,no:BY[s.id].no,result:s.result}:null),score:{round1:sub(0),round2:sub(1),total:sub(0)+sub(1)}},null,2);
}
const msg=t=>$('jm').textContent=t;
function fromJSON(txt){
  try{
    const d=JSON.parse(txt),seen=new Set();
    if(!Array.isArray(d.slots))throw new Error('slots がありません');
    slots=Array(10).fill(null);
    d.slots.slice(0,10).forEach((s,i)=>{const key=s&&s.level+'-'+s.no;if(s&&BY[key]&&!seen.has(key)){seen.add(key);slots[i]={id:key,result:s.result==='ok'||s.result==='ng'?s.result:null}}});
    const p=d.player||{};
    $('pnm').value=p.name||'';$('fname').value=d.name||'';
    render();msg('読み込みました');
  }catch(err){msg('読み込めません: '+err.message)}
}
$('bJson').onclick=()=>{msg('');$('jd').hidden=false};

$('jX').onclick=()=>$('jd').hidden=true;
$('jd').addEventListener('click',e=>{if(e.target===$('jd'))$('jd').hidden=true});
$('jDl').onclick=()=>{
  try{const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([toJSON()],{type:'application/json'}));
    a.download=($('fname').value.trim()||'scoresheet').replace(/[\\/:*?"<>|]/g,'_')+'.json';
    document.body.appendChild(a);a.click();a.remove();msg('保存を実行しました')}
  catch(_){msg('保存できませんでした')}
};


$('jf').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>fromJSON(t));e.target.value=''};

/* ドロワー表示中は背景をスクロールさせない */
const mo=new MutationObserver(()=>document.body.classList.toggle('lock',[...document.querySelectorAll('.ov')].some(o=>!o.hidden)));
document.querySelectorAll('.ov').forEach(o=>{
  mo.observe(o,{attributes:true,attributeFilter:['hidden']});
  o.addEventListener('touchmove',e=>{if(!e.target.closest('.pl,.lvs,textarea'))e.preventDefault()},{passive:false});
});
function guard(el){
  let y0=0;
  el.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
  el.addEventListener('touchmove',e=>{
    const d=e.touches[0].clientY-y0,top=el.scrollTop<=0,bot=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    if((top&&d>0)||(bot&&d<0)||el.scrollHeight<=el.clientHeight)e.preventDefault();
  },{passive:false});
}
document.querySelectorAll('.pl,textarea').forEach(guard);

/* PNG用: 技名を収める。まず文字を小さくし(20→14px)、それでも入らなければ折り返し(14→10px)。 */
function fitName(c,name,maxW,F){
  for(let fs=20;fs>=14;fs--){c.font=`600 ${fs}px ${F}`;if(c.measureText(name).width<=maxW)return{fs,lines:[name]}}
  let out;
  for(let fs=14;fs>=10;fs--){
    c.font=`600 ${fs}px ${F}`;
    const toks=(name.match(/[A-Za-z0-9'’.\-]+\s*|\s+|./gu)||[]).flatMap(t=>c.measureText(t).width>maxW?[...t]:[t]);
    const lines=[];let cur='';
    for(const t of toks){if(cur&&c.measureText((cur+t).trimEnd()).width>maxW){lines.push(cur.trimEnd());cur=t.trimStart()}else cur+=t}
    if(cur)lines.push(cur.trimEnd());
    out={fs,lines};
    if(lines.length<=Math.floor(44/(fs*1.2)))return out;
  }
  if(out.lines.length>3){out.lines=out.lines.slice(0,3);out.lines[2]=out.lines[2].slice(0,-1)+'…'}
  return out;
}
/* PNG出力（1枚に収まる固定レイアウトをcanvasで描画） */
function makePNG(){
  const W=900,P=40,RH=60,S=2,F='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
  const H=P+110+2*(50+5*RH+14)+70+P;
  const cv=document.createElement('canvas');cv.width=W*S;cv.height=H*S;
  const c=cv.getContext('2d');c.scale(S,S);c.textBaseline='middle';
  const T=(t,x,y,font,col,al)=>{c.font=font;c.fillStyle=col;c.textAlign=al||'left';c.fillText(t,x,y)};
  c.fillStyle='#fff';c.fillRect(0,0,W,H);
  T('SCORE SHEET',P,P+12,`700 20px ${F}`,'#667085');
  T(EDITION,W-P,P+12,`500 15px ${F}`,'#667085','right');
  T('Name',P,P+56,`500 15px ${F}`,'#667085');
  T($('pnm').value,P+70,P+54,`600 28px ${F}`,'#14171c');
  c.fillStyle='#14171c';c.fillRect(P+60,P+76,W-2*P-60,2);
  let y=P+110;
  for(let r=0;r<2;r++){
    T(r?'後半 Round 2':'前半 Round 1',P,y+20,`700 20px ${F}`,'#14171c');
    T('小計 '+sub(r),W-P,y+20,`700 20px ${F}`,'#14171c','right');
    y+=50;
    for(let k=0;k<5;k++){
      const s=slots[r*5+k],sk=s&&BY[s.id],cy=y+26;
      c.strokeStyle='#dfe3e8';c.lineWidth=1;c.strokeRect(P+.5,y+.5,W-2*P-1,52);
      T(String(r*5+k+1),P+22,cy,`500 16px ${F}`,'#667085','center');
      if(sk){
        c.fillStyle=`hsl(${sk.level*47+205} 55% 40%)`;c.fillRect(P+50,cy-13,84,26);
        T('Lv'+sk.level+'-'+sk.no,P+92,cy,`700 15px ${F}`,'#fff','center');
        {const f=fitName(c,sk.name,W-P-165-(P+146),F),lh=f.fs*1.2;f.lines.forEach((ln,n)=>T(ln,P+146,cy-(f.lines.length-1)*lh/2+n*lh,`600 ${f.fs}px ${F}`,'#14171c'))}
        
      }else T('—',P+50,cy,`400 18px ${F}`,'#98a2b3');
      const res=s&&s.result;
      T(res==='ok'?'○':res==='ng'?'✕':'－',W-P-130,cy,`700 28px ${F}`,res==='ok'?'#117a45':res==='ng'?'#b8312f':'#98a2b3','center');
      T(String(pts(s)),W-P-20,cy,`700 24px ${F}`,'#14171c','right');
      y+=RH;
    }
    y+=14;
  }
  c.fillStyle='#14171c';c.fillRect(P,y,W-2*P,70);
  T('TOTAL SCORE',P+24,y+35,`700 20px ${F}`,'#fff');
  T(`前半 ${sub(0)} + 後半 ${sub(1)}`,W-P-170,y+35,`400 16px ${F}`,'#cbd2dc','right');
  T(String(sub(0)+sub(1)),W-P-24,y+35,`700 40px ${F}`,'#fff','right');
  return cv;
}
$('bPng').onclick=()=>{$('pngImg').src=makePNG().toDataURL('image/png');$('pngM').textContent='スマホは画像を長押し、PCは右クリックでも保存できます';$('png').hidden=false};
$('pngX').onclick=()=>$('png').hidden=true;
$('png').addEventListener('click',e=>{if(e.target===$('png'))$('png').hidden=true});
$('pngDl').onclick=()=>{makePNG().toBlob(b=>{
  try{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=($('pnm').value.trim()||'scoresheet').replace(/[\\/:*?"<>|]/g,'_')+'.png';
    document.body.appendChild(a);a.click();a.remove();
    $('pngM').textContent='保存を実行しました。保存されない場合は画像を長押しして保存してください'}
  catch(_){$('pngM').textContent='画像を長押しして保存してください'}
})};

/* リセット（2回タップで確定） */
let rt=null;
$('bReset').onclick=()=>{
